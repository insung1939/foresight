<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표자 화면 — 타임슬립 개미</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #120e26; color: #ece8fb; font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  body { display: grid; grid-template-columns: 1fr 480px; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 22px; padding: 12px 24px; border-bottom: 1px solid #2a2350; }
  header::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(110deg, #6d4aff, #d63384 55%, #fd7e14); }
  .pos { font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .pos small { color: #8c84b3; font-size: 18px; font-weight: 600; margin-left: 4px; }
  .dots i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; background: #2f2858; margin-right: 6px; }
  .dots i.on { background: #d63384; }
  .wait { color: #fd7e14; font-weight: 700; }
  .sp { flex: 1; }
  .pace { font-size: 17px; color: #8c84b3; font-weight: 700; text-align: right; line-height: 1.3; }
  .pace b { color: #ece8fb; }
  .pace .late { color: #ff8787; } .pace .early { color: #63e6be; }
  .timer { font: 800 40px ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; min-width: 140px; text-align: right; }
  .timer.warn { color: #ffd43b; } .timer.over { color: #ff6b6b; }
  .clock { color: #8c84b3; font: 600 18px ui-monospace, Menlo, monospace; }
  main { overflow-y: auto; padding: 26px 40px 40vh; }
  main h1 { font-size: 30px; font-weight: 900; letter-spacing: -.02em; }
  main .time { color: #8c84b3; font-size: 17px; font-weight: 700; margin: 4px 0 20px; }
  .seg { font-size: 27px; line-height: 1.65; padding: 12px 18px; margin: 0 -18px 8px; border-radius: 14px; color: #6f6896; transition: background .2s, color .2s; }
  .seg.done { color: #9a93bf; }
  .seg.now { color: #fff; background: #221b45; box-shadow: inset 5px 0 0 #d63384; }
  .seg .n { display: inline-block; min-width: 40px; font-size: 15px; color: #d63384; font-weight: 900; vertical-align: 3px; }
  .seg .dir { color: #fd7e14; font-weight: 800; }
  .seg.now .dir { color: #ffa94d; }
  aside { border-left: 1px solid #2a2350; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .lab { font-size: 14px; color: #8c84b3; font-weight: 800; letter-spacing: .05em; }
  .pv { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; border: 1px solid #2a2350; flex: none; }
  .pv iframe { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .pv.next { opacity: .85; }
  .nexttitle { font-size: 17px; color: #c8c1e8; font-weight: 700; min-height: 22px; }
  .plan { font-size: 14px; color: #8c84b3; line-height: 1.7; overflow: auto; }
  .plan div { display: flex; justify-content: space-between; padding: 0 6px; border-radius: 6px; }
  .plan div.now { background: #221b45; color: #fff; font-weight: 800; }
  .keys { margin-top: auto; font-size: 13px; color: #6f6896; line-height: 1.8; }
  .keys kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid #3a3266; border-radius: 4px; padding: 0 5px; color: #c8c1e8; }
  .btns { display: flex; gap: 8px; }
  .btns button { flex: 1; font-weight: 800; font-size: 18px; font-family: inherit; padding: 12px; border-radius: 12px; border: 0; background: #2a2350; color: #fff; cursor: pointer; }
  .btns button.pri { background: linear-gradient(110deg, #6d4aff, #d63384); }
  @media (max-width: 960px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; }
    main { padding-bottom: 40px; }
    aside { border-left: 0; border-top: 1px solid #2a2350; }
    #qa { inset: 64px 0 0 0; }
  }
  #qa { display: none; position: fixed; inset: 64px 496px 0 0; overflow-y: auto; background: #120e26; padding: 28px 40px; z-index: 5; }
  body.qa #qa { display: block; }
  #qa h1 { font-size: 28px; margin-bottom: 16px; }
  #qa dt { font-size: 23px; font-weight: 900; margin-top: 18px; color: #ffa94d; }
  #qa dd { font-size: 21px; line-height: 1.6; color: #ddd7f5; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <div class="pos" id="pos">–</div>
  <div class="dots" id="dots"></div>
  <span class="wait" id="wait">발표 창을 기다리는 중… (발표 창에서 P 를 누르세요)</span>
  <div class="sp"></div>
  <div class="pace" id="pace"></div>
  <div class="timer" id="timer" title="T: 초기화">00:00</div>
  <div class="clock" id="clock"></div>
</header>
<main id="script"></main>
<aside>
  <div class="lab">지금 화면</div>
  <div class="pv"><iframe id="now" src="index.html?preview" tabindex="-1"></iframe></div>
  <div class="lab">다음</div>
  <div class="pv next"><iframe id="nxt" src="index.html?preview" tabindex="-1"></iframe></div>
  <div class="nexttitle" id="nexttitle"></div>
  <div class="btns"><button id="b-prev">← 이전</button><button class="pri" id="b-next">다음 →</button></div>
  <div class="lab">시간 계획</div>
  <div class="plan" id="plan"></div>
  <div class="keys">
    <kbd>→</kbd> <kbd>Space</kbd> 다음 · <kbd>←</kbd> 이전 (이 창에서 눌러도 발표 창이 넘어감)<br>
    <kbd>T</kbd> 타이머 초기화 · <kbd>Q</kbd> 예상 질문 · <kbd>+</kbd> <kbd>-</kbd> 글자 크기
  </div>
</aside>
<div id="qa"></div>
<script src="deck.js"></script>
<script>
/* 발표자 화면 — 발표 창(index.html)과 같은 장·단계를 따라간다. 대본은 deck.js 의 NOTES(= docs/script.md). */
const $ = (s) => document.querySelector(s);
const bus = makeBus();
const mmss = (s) => `${s < 0 ? "−" : ""}${String(Math.floor(Math.abs(s) / 60)).padStart(2, "0")}:${String(Math.abs(s) % 60).padStart(2, "0")}`;
const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const fmt = (t) => esc(t).replace(/\[([^\]]+)\]/g, '<span class="dir">[$1]</span>');
const ends = []; NOTES.reduce((a, n, i) => (ends[i] = a + n.sec), 0);
const TOTAL = ends[ends.length - 1];
let st = null, t0 = null;

$("#plan").innerHTML = NOTES.map((n, i) => `<div data-i="${i}"><span>${i + 1}. ${n.title}</span><span>${n.sec}초 · ~${mmss(ends[i])}</span></div>`).join("") +
  `<div><span>합계</span><span>${mmss(TOTAL)} (5:00~5:45)</span></div>`;
$("#qa").innerHTML = `<h1>예상 질문 (Q 로 닫기)</h1><dl>${QA.map(([q, a]) => `<dt>Q. ${esc(q)}</dt><dd>${esc(a)}</dd>`).join("")}</dl>`;

function show(d) {
  const same = st && st.cur === d.cur;
  st = d;
  const n = NOTES[d.cur] || { title: "", sec: 0, segs: [] };
  $("#pos").innerHTML = `${d.cur + 1}<small>/ ${d.total}</small>`;
  $("#dots").innerHTML = d.max ? Array.from({ length: d.max + 1 }, (_, k) => `<i class="${k <= d.step ? "on" : ""}"></i>`).join("") : "";
  if (!same) {
    $("#script").innerHTML = `<h1>${d.cur + 1}. ${esc(n.title)}</h1><div class="time">이 장 ${n.sec}초 · 여기까지 목표 ${mmss(ends[d.cur] || 0)}${n.segs.length - 1 !== d.max ? ` · 대본 단계 ${n.segs.length - 1} / 화면 단계 ${d.max}` : ""}</div>` +
      n.segs.map((h, k) => `<div class="seg" data-k="${k}">${k ? `<span class="n">→${k}</span>` : ""}${fmt(h)}</div>`).join("");
    $("#script").scrollTop = 0;
    document.querySelectorAll(".plan div[data-i]").forEach((x) => x.classList.toggle("now", +x.dataset.i === d.cur));
  }
  const k = Math.min(d.step, n.segs.length - 1);
  document.querySelectorAll(".seg").forEach((s) => { const i = +s.dataset.k; s.classList.toggle("now", i === k); s.classList.toggle("done", i < k); });
  if (d.step > 0) document.querySelector(".seg.now")?.scrollIntoView({ block: "center", behavior: "smooth" });

  preview("#now", d.cur, d.step);
  const last = d.cur === d.total - 1 && d.step >= d.max;
  if (d.step < d.max) { preview("#nxt", d.cur, d.step + 1); $("#nexttitle").textContent = `같은 장 ${d.step + 1}단계`; }
  else if (!last) { preview("#nxt", d.cur + 1, 0); $("#nexttitle").textContent = `${d.cur + 2}. ${NOTES[d.cur + 1]?.title || ""}`; }
  else $("#nexttitle").textContent = "마지막 장 — 질문 받기";
  $("#wait").style.display = "none";
  if (!t0) t0 = Date.now();
  tick();
}
const pend = {};
function preview(sel, cur, step) {
  const w = $(sel).contentWindow;
  if (w && w.deckGo) w.deckGo(cur, step); else pend[sel] = [cur, step];
}
function sizePv() {
  document.querySelectorAll(".pv iframe").forEach((f) => (f.style.transform = `scale(${f.parentElement.clientWidth / 1600})`));
}
["#now", "#nxt"].forEach((sel) => $(sel).addEventListener("load", () => { if (pend[sel]) preview(sel, ...pend[sel]); }));
addEventListener("resize", sizePv); sizePv();

bus.on((d) => { if (d && "cur" in d) show(d); });
const send = (cmd) => bus.post({ cmd });
$("#b-prev").onclick = () => send("prev");
$("#b-next").onclick = () => send("next");
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); send("next"); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); send("prev"); }
  else if (k === "t" || k === "T") { t0 = Date.now(); tick(); }
  else if (k === "q" || k === "Q") document.body.classList.toggle("qa");
  else if (k === "+" || k === "=" || k === "-") {
    const z = +(document.documentElement.style.zoom || 1) + (k === "-" ? -0.1 : 0.1);
    document.documentElement.style.zoom = Math.max(.6, Math.min(1.8, z)).toFixed(1);
  }
});
function tick() {
  $("#clock").textContent = new Date().toTimeString().slice(0, 5);
  if (!t0) return;
  const s = Math.floor((Date.now() - t0) / 1000);
  $("#timer").textContent = mmss(s);
  $("#timer").classList.toggle("warn", s > 300 && s <= 345);
  $("#timer").classList.toggle("over", s > 345);
  if (st) {
    const goal = ends[st.cur] || 0, start = goal - (NOTES[st.cur]?.sec || 0), diff = s - goal;
    const cls = s > goal ? "late" : s < start ? "early" : "";
    $("#pace").innerHTML = `이 장 목표 <b>${mmss(start)}~${mmss(goal)}</b><br><span class="${cls}">${s > goal ? `${diff}초 늦음` : s < start ? `${start - s}초 빠름` : "제 속도"}</span> · 전체 ${mmss(TOTAL)}`;
  }
}
setInterval(tick, 500);
send("hello");
</script>
</body>
</html>
