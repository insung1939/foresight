# 안정성: 10분마다 서비스가 살아 있는지 밖에서 확인한다(서버·DB·시즌 팩·데이터 기준일).
# 무료 서버(Render)가 잠들지 않게 깨워 두는 역할도 한다. 실패하면 GitHub 이 메일로 알린다.
name: uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API 상태 점검
        run: |
          for i in 1 2 3; do
            body=$(curl -sS --max-time 60 https://foresight-api-yda3.onrender.com/v1/health) && break
            sleep 20
          done
          echo "$body"
          echo "$body" | python3 -c "
          import json, sys
          h = json.load(sys.stdin)
          assert h['ok'], '서버·DB·시즌 팩 중 이상'
          assert not h.get('stale'), f\"데이터가 오래됨: 마지막 주 {h['data']['lastWeek']}\"
          print('정상')"
      - name: 화면
        run: test "$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://foresight-rho-teal.vercel.app/)" = 200
