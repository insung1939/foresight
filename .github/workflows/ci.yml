# 신뢰성·유지보수성: 올릴 때마다 서버 테스트와 화면 빌드(타입 검사 포함)를 자동으로 돌린다.
name: ci
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_KEY: ${{ secrets.DATA_KEY }}
      RATE_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/requirements.txt }
      - run: pip install -r api/requirements.txt pytest
      - name: 시즌 팩 풀기
        if: env.DATA_KEY != ''
        run: python scripts/pack_data.py --unpack
      - name: 테스트
        if: env.DATA_KEY != ''
        run: cd api && PYTHONPATH=. python -m pytest -q tests
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vite build
