# 데이터 지속가능성: 매주 일요일 아침(KST 07:00) hindsight → 시즌 팩·검색 색인을 다시 만들고,
# 품질 관문(scripts/check_pack.py)과 테스트를 통과하면 data/pack.enc 를 커밋 → Render 가 자동으로 다시 배포한다.
# 실패하면 아무것도 바꾸지 않고(이전 데이터로 계속 서비스) GitHub 이 메일로 알린다. 손으로 돌리기: Actions → Run workflow
name: data-weekly
on:
  schedule:
    - cron: "0 22 * * 6"   # 토 22:00 UTC = 일 07:00 KST (금요일 종가까지 다 모인 뒤)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: data-weekly, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HINDSIGHT_DATABASE_URL: ${{ secrets.HINDSIGHT_DATABASE_URL }}
      DART_KEY: ${{ secrets.DART_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DATA_KEY: ${{ secrets.DATA_KEY }}
      RATE_LIMIT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: api/requirements.txt }
      - name: 의존성
        run: pip install -r api/requirements.txt pytest
      - name: 지난 팩 풀기(비교 기준 + 순서·벡터 이어받기)
        run: |
          python scripts/pack_data.py --unpack
          mkdir -p /tmp/old && cp data/season.json data/rag.json /tmp/old/
      - name: 시즌 팩 다시 만들기(hindsight 읽기만)
        run: python scripts/build_season.py
      - name: 검색 색인 늘리기(하루 무료 한도 안에서)
        run: timeout 25m python scripts/build_rag.py --budget 900 || echo "색인은 이어받은 것만으로 만듦"
      - name: 품질 관문
        run: python scripts/check_pack.py --old /tmp/old
      - name: 테스트(새 데이터로)
        run: cd api && PYTHONPATH=. python -m pytest -q tests
      - name: 묶어서 커밋
        run: |
          python scripts/pack_data.py
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pack.enc
          if git diff --cached --quiet; then echo "바뀐 데이터 없음"; exit 0; fi
          LAST=$(python -c "import json;print(json.load(open('data/season.json'))['weeks'][-1])")
          git commit -m "데이터 주간 갱신: 마지막 주 ${LAST}"
          git push
